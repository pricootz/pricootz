name: Build Pricop PowerPoint Tools Installer

on:
  push:
    branches:
      - agent/powerpoint-tools-installer
    paths:
      - 'powerpoint-tools/**'
      - '.github/workflows/build-powerpoint-tools.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: powerpoint-tools

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build add-in
        run: msbuild .\src\Pricop.PowerPointTools\Pricop.PowerPointTools.csproj /t:Restore,Build /p:Configuration=Release

      - name: Generate installer assets
        shell: powershell
        run: .\tools\GenerateAssets.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer\PricopPowerPointTools.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PricopPowerPointTools-Setup
          path: powerpoint-tools/dist/PricopPowerPointTools-Setup.exe
          if-no-files-found: error
